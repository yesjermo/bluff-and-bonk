name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
        working-directory: server

  web:
    name: Web + shared TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements-dev.txt
      - run: npm ci
        working-directory: web
      - name: Typecheck and build
        run: npm run build
        working-directory: web
      - name: Transform + physics parity tests
        run: npm test
        working-directory: web
      - name: Cross-play match against a live server
        run: |
          (cd server && .venv/bin/uvicorn app.main:app --port 8000 &) 
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          cd web && npm run test:crossplay

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
