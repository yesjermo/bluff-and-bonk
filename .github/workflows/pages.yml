name: Deploy web demo

# Builds the browser game in offline-practice mode (no server needed) and
# publishes it to https://yesjermo.github.io/bluff-and-bonk/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:pages
        working-directory: web
        env:
          # Set the repo variable BONK_SERVER_URL (e.g. https://bluff-and-bonk.onrender.com)
          # to enable Create/Join Room on the website. Empty = practice only.
          VITE_SERVER_URL: ${{ vars.BONK_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
